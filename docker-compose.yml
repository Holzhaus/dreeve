services:
    php-cli:
        build:
            context: ./
            dockerfile: docker/php-cli/Dockerfile
        container_name: 'statistics-for-strava-php-cli'
        volumes:
            - './:/var/www/'
            - /var/www/backups
        working_dir: /var/www
        env_file:
            - path: ./.env
              required: true
            - path: ./.env.local
              required: false
        environment:
            - PHP_IDE_CONFIG=phpstorm
            - TZ=Europe/Brussels
        profiles: [on-demand]
        networks:
            - statistics-for-strava-network
    app:
        build:
            context: ./
            dockerfile: docker/app/Dockerfile
        container_name: 'statistics-for-strava-app'
        volumes:
            - ./config/app:/var/www/config/app
            - ./build:/var/www/build
            - ./storage/database:/var/www/storage/database
            - ./storage/files:/var/www/storage/files
            - ./watch:/var/www/watch
            - ./backups:/var/www/backups
        env_file: '.env.local'
        # The image runs as 65532, but in development the php-cli container writes the mounted
        # folders as root, so the app has to run as root as well.
        user: root
        read_only: true
        tmpfs:
          - /tmp
        healthcheck:
          test: ["CMD", "docker-healthcheck"]
          start_period: 60s
        environment:
          - TZ=Europe/Brussels
        ports:
            - '8081:8080'
        networks:
            - statistics-for-strava-network
    daemon:
      build:
        context: ./
        dockerfile: docker/app/Dockerfile
      container_name: 'statistics-for-strava-daemon'
      restart: unless-stopped
      volumes:
        - ./config/app:/var/www/config/app
        - ./build:/var/www/build
        - ./storage/database:/var/www/storage/database
        - ./storage/files:/var/www/storage/files
        - ./watch:/var/www/watch
        - ./backups:/var/www/backups
      env_file: ".env.local"
      # See the app service.
      user: root
      read_only: true
      tmpfs:
        - /tmp
      healthcheck:
        test: ["CMD", "docker-healthcheck"]
        start_period: 5s
      environment:
        - TZ=Europe/Brussels
      command: ['bin/console', 'app:daemon:run']
      networks:
        - statistics-for-strava-network

networks:
    statistics-for-strava-network: {}
